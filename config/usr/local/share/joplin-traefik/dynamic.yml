tls:
  certificates:
    - certFile: /run/secrets/joplin_https_cert
      keyFile: /run/secrets/joplin_https_key

http:
  routers:
    router0:
      entryPoints:
        - websecure
      service: service-joplin
      rule: Host(`joplin.home.arpa`)
      tls: {}

  services:
    service-joplin:
      loadBalancer:
        servers:
          - url: http://joplin-server:22300/
